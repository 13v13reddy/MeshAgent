name: Windows Compatibility Build

on:
  push:
    branches:
      - compat-build-test
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
            
      - name: Generate commit header
        shell: pwsh
        run: |
          $hash = git rev-parse HEAD
          $date = git show -s --format=%ci HEAD
          $lines = @(
            '// This file is auto-generated, any edits may be overwritten'
            ('#define SOURCE_COMMIT_DATE "{0}"' -f $date)
            ('#define SOURCE_COMMIT_HASH "{0}"' -f $hash)
          )
          $lines | Set-Content -Encoding ASCII microscript/ILibDuktape_Commit.h
          Get-Content microscript/ILibDuktape_Commit.h

      - name: Restore provisioning manifest
        shell: pwsh
        env:
          MESH_AGENT_MSH_B64: ${{ secrets.MESH_AGENT_MSH_B64 }}
        run: |
          if (-not $env:MESH_AGENT_MSH_B64) {
            throw "MESH_AGENT_MSH_B64 secret is missing"
          }

          $b64 = ($env:MESH_AGENT_MSH_B64 -replace '\s','').Trim()
          $bytes = [Convert]::FromBase64String($b64)

          [IO.File]::WriteAllBytes(
            (Join-Path $PWD 'MeshAgent.msh'),
            $bytes
          )

          Get-FileHash .\MeshAgent.msh -Algorithm SHA256
          Get-Item .\MeshAgent.msh | Select-Object FullName, Length

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build matching Windows x64 package
        shell: pwsh
        run: |
          msbuild MeshAgent.Build.proj `
            /t:BuildStealthLabX64 `
            /p:MeshAgentProvisioningManifest="$PWD\MeshAgent.msh" `
            /p:WindowsTargetPlatformVersion=10.0 `
            /m `
            /nologo `
            /verbosity:minimal
        
      - name: Embed MeshAgent provisioning manifest
        shell: pwsh
        run: |
          $exe = 'meshservice\x64\StealthLab\MeshService-2022.exe'
          $msh = 'MeshAgent.msh'

          if (-not (Test-Path $exe)) {
            throw "Built EXE not found: $exe"
          }

          if (-not (Test-Path $msh)) {
            throw "Provisioning manifest not found: $msh"
          }

          $exeBytes = [IO.File]::ReadAllBytes($exe)
          $mshBytes = [IO.File]::ReadAllBytes($msh)

          $guid = [byte[]]@(
            0xB9,0x96,0x01,0x58,
            0x80,0x54,0x4A,0x19,
            0xB7,0xF7,0xE9,0xBE,
            0x44,0x91,0x4C,0x19
          )

          $len = $mshBytes.Length

          # 4-byte BIG-ENDIAN length
          $lenBytes = [byte[]]@(
            (($len -shr 24) -band 0xFF),
            (($len -shr 16) -band 0xFF),
            (($len -shr 8)  -band 0xFF),
            ($len -band 0xFF)
          )

          $out = New-Object IO.MemoryStream
          $out.Write($exeBytes, 0, $exeBytes.Length)
          $out.Write($mshBytes, 0, $mshBytes.Length)
          $out.Write($lenBytes, 0, $lenBytes.Length)
          $out.Write($guid, 0, $guid.Length)

          [IO.File]::WriteAllBytes($exe, $out.ToArray())
          $out.Dispose()

          Write-Host "Embedded MeshAgent.msh into $exe"
          Write-Host "MSH bytes: $len"
          Write-Host "Final EXE bytes: $((Get-Item $exe).Length)"
        
      - name: Verify embedded provisioning manifest
        shell: pwsh
        run: |
          $exe = 'meshservice\x64\StealthLab\MeshService-2022.exe'
          $msh = 'MeshAgent.msh'

          $data = [IO.File]::ReadAllBytes($exe)
          $sourceMsh = [IO.File]::ReadAllBytes($msh)

          $expectedGuid = [byte[]]@(
            0xB9,0x96,0x01,0x58,
            0x80,0x54,0x4A,0x19,
            0xB7,0xF7,0xE9,0xBE,
            0x44,0x91,0x4C,0x19
          )

          $guidOffset = $data.Length - 16
          $actualGuid = $data[$guidOffset..($data.Length - 1)]

          if ([Convert]::ToHexString($actualGuid) -ne [Convert]::ToHexString($expectedGuid)) {
            throw "Embedded MSH GUID trailer is missing"
          }

          $lenOffset = $data.Length - 20
          $mshLen =
            ($data[$lenOffset]     -shl 24) -bor
            ($data[$lenOffset + 1] -shl 16) -bor
            ($data[$lenOffset + 2] -shl 8)  -bor
            $data[$lenOffset + 3]

          if ($mshLen -ne $sourceMsh.Length) {
            throw "Embedded MSH length mismatch: embedded=$mshLen source=$($sourceMsh.Length)"
          }

          $mshStart = $data.Length - 20 - $mshLen
          $embedded = $data[$mshStart..($mshStart + $mshLen - 1)]

          $sourceHash = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($sourceMsh)
          )

          $embeddedHash = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($embedded)
          )

          Write-Host "Source MSH SHA256:   $sourceHash"
          Write-Host "Embedded MSH SHA256: $embeddedHash"

          if ($sourceHash -ne $embeddedHash) {
            throw "Embedded MSH does not match source MeshAgent.msh"
          }

          Write-Host "Provisioning manifest embedding verified."

      - name: Show outputs
        shell: pwsh
        run: |
          Get-Item `
            meshservice\x64\StealthLab_DLL\MeshService-2022.dll,
            meshservice\x64\StealthLab\MeshService-2022.exe |
            Select-Object FullName,Length,LastWriteTime

      - name: Verify MeshUmhHostW export
        shell: pwsh
        run: |
          $dll = Resolve-Path "meshservice\x64\StealthLab_DLL\MeshService-2022.dll"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio C++ tools not found"
          }

          $dumpbin = Get-ChildItem `
            "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe not found"
          }

          Write-Host "Using dumpbin: $($dumpbin.FullName)"

          $exports = & $dumpbin.FullName /exports $dll

          $exports | Select-String "MeshUmhHostW"

          if (-not ($exports | Select-String "MeshUmhHostW" -Quiet)) {
            throw "MeshUmhHostW export not found"
          }

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null

          Copy-Item `
            "meshservice\x64\StealthLab\MeshService-2022.exe" `
            "artifacts\MeshService64.exe"

          Copy-Item `
            "meshservice\x64\StealthLab_DLL\MeshService-2022.dll" `
            "artifacts\MeshServiceHost64.dll"

          Get-ChildItem artifacts |
            Select-Object Name,Length,LastWriteTime

          Get-FileHash artifacts\* -Algorithm SHA256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meshagent-compat-${{ github.sha }}
          path: artifacts/
          retention-days: 7
