name: Windows Compatibility Build

on:
  push:
    branches:
      - compat-build-test
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
            
      - name: Generate commit header
        shell: pwsh
        run: |
          $hash = git rev-parse HEAD
          $date = git show -s --format=%ci HEAD
          $lines = @(
            '// This file is auto-generated, any edits may be overwritten'
            ('#define SOURCE_COMMIT_DATE "{0}"' -f $date)
            ('#define SOURCE_COMMIT_HASH "{0}"' -f $hash)
          )
          $lines | Set-Content -Encoding ASCII microscript/ILibDuktape_Commit.h
          Get-Content microscript/ILibDuktape_Commit.h

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build matching Windows x64 package
        shell: pwsh
        run: |
          msbuild MeshAgent.Build.proj `
            /t:BuildStealthLabX64 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /m `
            /nologo `
            /verbosity:minimal

      - name: Show outputs
        shell: pwsh
        run: |
          Get-Item `
            meshservice\x64\StealthLab_DLL\MeshService-2022.dll,
            meshservice\x64\StealthLab\MeshService-2022.exe |
            Select-Object FullName,Length,LastWriteTime

      - name: Verify MeshUmhHostW export
        shell: pwsh
        run: |
          $dll = Resolve-Path "meshservice\x64\StealthLab_DLL\MeshService-2022.dll"

          dumpbin /exports $dll |
            Select-String "MeshUmhHostW"

          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed"
          }

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null

          Copy-Item `
            "meshservice\x64\StealthLab\MeshService-2022.exe" `
            "artifacts\MeshService64.exe"

          Copy-Item `
            "meshservice\x64\StealthLab_DLL\MeshService-2022.dll" `
            "artifacts\MeshServiceHost64.dll"

          Get-ChildItem artifacts |
            Select-Object Name,Length,LastWriteTime

          Get-FileHash artifacts\* -Algorithm SHA256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meshagent-compat-${{ github.sha }}
          path: artifacts/
          retention-days: 7
